apiVersion: apps/v1
kind: Deployment
metadata:
  name: comin-admin-dashboard-webapp
  namespace: comin-dev
  labels:
    app: comin-admin-dashboard-webapp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: comin-admin-dashboard-webapp
  template:
    metadata:
      labels:
        app: comin-admin-dashboard-webapp
    spec:
      containers:
      - name: comin-admin-dashboard-webapp
        image: ghcr.io/kaveeshag/comin-admin-dashboard-webapp:e7a263f743b3d451e36c39bcedcc7406c2094460
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
        resources:
          limits:
            cpu: "1"
            memory: "1024Mi"
          requests:
            cpu: "0.5"
            memory: "512Mi"